<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steuerpult</title>
<style>/*STIL*/
  /* Einspaltige Raster dürfen schmaler werden als ihr breitester Inhalt (lange Namen, Auswahllisten, Code). */
  .meldungen, .sperre-liste, .knoten, .messungen, .mess, .k-fakten, .k-aktionen, .codes, .detail, .detail-inhalt, .filter, .abgleich,
  .panel, .plan-block, .panel-liste, .panel .formular, .panel .bestaetigung { grid-template-columns: minmax(0, 1fr); }

  /* ── Aufbau: Lage-Satz, Reiter, vier Bereiche ─────────────────────────────── */
  #lage-satz { margin-bottom: 14px; }
  #lage-satz > .laedt { padding: 4px 2px; }
  #lage-satz .satz-text > .link { display: inline-flex; min-height: 36px; padding: 0 2px; margin-top: 2px; }
  #reiter { display: flex; width: 100%; max-width: 480px; margin-bottom: 24px; }
  #reiter button { flex: 1 1 auto; min-width: 0; min-height: 36px; padding: 0 12px; gap: 7px; }
  #reiter .punkt { width: 7px; height: 7px; box-shadow: none; }
  [data-panel] > .abschnitt + .abschnitt { margin-top: 32px; }
  .meldungen { display: grid; gap: 8px; margin-bottom: 12px; }
  .meldungen:empty { display: none; }
  .meldungen > .link { justify-self: start; min-height: 36px; padding: 4px; white-space: normal; text-align: left; line-height: 1.35; }
  .meldungen.oben { margin: 0 0 14px; }
  .meldungen.nach-zahlen { margin-top: 14px; }
  .ablage:empty { display: none; }
  .ablage:not(:empty) { margin-top: 2px; }
  .klemme { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .klemme.lang { cursor: pointer; }
  .klemme.offen { display: block; -webkit-line-clamp: unset; }
  .sperre { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; line-height: 1.45; color: var(--warn); overflow-wrap: anywhere; }
  .sperre .ico { flex: none; margin-top: 1px; font-size: 14px; }
  .sperre-liste { display: grid; gap: 6px; }
  .hinweis > span { min-width: 0; }
  .hinweis details { margin-top: 2px; }
  .hinweis details > summary { min-height: 26px; }
  .hinweis details p { margin: 4px 0 2px; color: var(--mut); font-size: 12.5px; }

  /* ── Knotenkarten ─────────────────────────────────────────────────────────── */
  #knoten { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
  /* Mauerwerk: die Karten sind unterschiedlich hoch. Das Skript misst sie und gibt jeder so viele schmale Zeilen,
     wie sie braucht; die nächste Karte rückt unter die kürzere. Ohne Skript bleibt es ein gewöhnliches Raster. */
  #knoten.mauer { grid-auto-rows: 4px; row-gap: 0; }
  #knoten > :where(.zustand, .gruppe, .laedt) { grid-column: 1 / -1; }
  .knoten { display: grid; gap: 16px; align-content: start; padding: 18px; container-type: inline-size; transition: border-color 0.6s, box-shadow 0.6s; }
  .knoten.fokus { border-color: color-mix(in oklab, var(--akz) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--akz) 20%, transparent); }
  .k-kopf { display: flex; align-items: flex-start; gap: 13px; }
  .k-titel { min-width: 0; flex: 1 1 auto; }
  .k-titel h3 { margin: 2px 0 0; font-size: 18px; line-height: 1.2; letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .k-status { margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--mut); }
  .k-status.schlecht { color: var(--schlecht); font-weight: var(--font-weight-medium); }
  .k-marken { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .hinweis .klemme { margin-top: 2px; color: var(--mut); font-size: 12.5px; }
  .messungen { display: grid; gap: 16px; }
  /* Breite Karte (ein Knoten pro Zeile, z. B. im Chat): Messungen paarweise nebeneinander statt eine unter der anderen. */
  @container (min-width: 500px) { .messungen { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; } }
  .mess { display: grid; gap: 7px; align-content: start; }
  .mess-kopf { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .mess-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; font-weight: var(--font-weight-semibold); color: var(--mut); white-space: nowrap; }
  .mess-name .ico { flex: none; }
  .mess-name .ico { font-size: 15px; color: var(--leise); }
  .mess-name .mut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--font-weight-normal); color: var(--leise); }
  .mess-wert { flex: none; margin-left: auto; font-size: 22px; line-height: 1; font-weight: var(--font-weight-semibold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .mess-wert small { margin-left: 2px; font-size: 12px; font-weight: var(--font-weight-medium); letter-spacing: 0; color: var(--mut); }
  .mess-wert.warn { color: var(--warn); }
  .mess-wert.schlecht { color: var(--schlecht); }
  .mess-wert.ohne { color: var(--leise); }
  .mess-unter { display: flex; flex-wrap: wrap; gap: 1px 14px; font-size: 12.5px; line-height: 1.5; color: var(--mut); font-variant-numeric: tabular-nums; }
  .mess-spur { display: block; width: 100%; height: 16px; margin-top: -2px; color: var(--leise); }
  .mess-spur.warn { color: var(--warn); }
  .mess-spur.schlecht { color: var(--schlecht); }
  .mess-spur .flaeche { fill: color-mix(in oklab, currentColor 14%, transparent); stroke: none; }
  .mess-spur .linie { fill: none; stroke: currentColor; stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .mess .balken > b { position: absolute; top: 0; bottom: 0; left: var(--ang); width: 2px; margin-left: -1px; border-radius: 1px; background: var(--fg); opacity: 0.8; }
  .ang { cursor: help; }
  .tick { display: inline-block; width: 2px; height: 11px; margin-right: 6px; border-radius: 1px; background: var(--fg); opacity: 0.8; vertical-align: -1px; }
  .k-fakten { display: grid; gap: 2px; font-size: 12.5px; line-height: 1.5; color: var(--mut); }
  .k-aktionen { display: grid; gap: 10px; }
  .k-konfig > details > summary { color: var(--mut); }
  .k-konfig dl.kv { margin: 8px 0 4px; }
  .k-konfig dl.kv dd > .marke + .marke { margin-left: 4px; }
  .codes { display: grid; gap: 3px; margin-top: 6px; max-height: 220px; overflow: auto; font-size: 12px; }
  .codes code { display: block; width: fit-content; max-width: 100%; }
  .pods { list-style: none; margin: 6px 0 0; padding: 0; max-height: 280px; overflow: auto; }
  .pods li { display: flex; align-items: baseline; gap: 8px; padding: 5px 2px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .pods li:first-child { border-top: 0; }
  .pods .punkt { align-self: center; }
  .pods .pod-name { min-width: 0; overflow-wrap: anywhere; }

  /* ── Zeilenblöcke: Zeile, aufklappbares Detail, Platz für Aktions-Panels ─────── */
  .gruppe > .blk + .blk { border-top: 1px solid var(--line); }
  .blk > .zeile { width: 100%; }
  .detail { display: grid; gap: 12px; padding: 2px 16px 16px 60px; }
  .detail-inhalt { display: grid; gap: 12px; }
  .detail-inhalt:empty { display: none; }
  .detail dl.kv { margin: 0; }
  .blk > .ablage:not(:empty) { padding: 0 14px 14px; }
  .bereit { font-weight: var(--font-weight-semibold); color: var(--fg); }
  .bereit.warn { color: var(--warn); }
  .bereit.schlecht { color: var(--schlecht); }
  .bereit.aus { font-weight: var(--font-weight-normal); color: var(--leise); }
  .grp-kopf { display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; font-size: 13px; font-weight: var(--font-weight-semibold); color: var(--mut); }
  .grp-kopf .mut { font-weight: var(--font-weight-normal); color: var(--leise); }
  .grp + .grp { margin-top: 20px; }
  .grp.nach-zahlen { margin-top: 22px; }
  .filter { display: grid; gap: 10px; margin-bottom: 12px; }
  .filter .leiste > select { max-width: 100%; }
  .mehr-knopf { display: flex; justify-content: center; margin-top: 12px; }
  .kennzahlen.breit { grid-template-columns: repeat(auto-fit, minmax(min(100%, 168px), 1fr)); }
  /* Gleich hohe Karten: bricht eine Beschriftung um, bleiben die Zahlen trotzdem auf einer Linie (Zahl und Unterzeile rücken nach unten). */
  .kennzahlen.gleich > .kennzahl > .zahl-gross { margin-top: auto; }
  .kennzahl .zahl-gross { font-size: 30px; }
  .karte > .kopfzeile { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .kopfzeile .zeile-titel { font-size: 15px; }
  .abgleich { display: grid; gap: 12px; }
  .abgleich p { margin: 0; }
  .abgleich .leiste > select { flex: 1 1 220px; }
  .rauschen { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--leise); }
  .rauschen .ico { margin-top: 2px; }
  .zahl-fett { color: var(--fg); font-weight: var(--font-weight-semibold); }
  details.skript { margin-top: 10px; }

  /* ── Aktions-Panels: Trockenlauf, Ausführen, Logs, Räumen-Probe ──────────────── */
  .panel { display: grid; gap: 12px; padding: 14px 16px; border: 1px solid var(--color-border-info); border-radius: var(--r-m); background: var(--color-background-info); }
  .panel.fertig { border-color: var(--color-border-success); background: var(--color-background-success); }
  .panel.neutral { border-color: var(--line-2); background: var(--flaeche); }
  .plan-block { display: grid; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .panel-kopf { display: flex; align-items: center; gap: 11px; }
  .panel-titel { display: grid; min-width: 0; flex: 1 1 auto; line-height: 1.35; }
  .panel-titel b { font-size: 14px; font-weight: var(--font-weight-semibold); }
  .panel-titel span { font-size: 12.5px; color: var(--mut); overflow-wrap: anywhere; }
  .panel-plan { font-size: 14px; font-weight: var(--font-weight-medium); line-height: 1.5; overflow-wrap: anywhere; }
  .panel-liste { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .panel-liste li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: var(--mut); overflow-wrap: anywhere; }
  .panel-liste .ico { flex: none; margin-top: 2px; font-size: 14px; color: var(--akz); }
  .panel .formular { display: grid; gap: 12px; }
  .panel .bestaetigung { display: grid; gap: 4px; }
  .panel .bestaetigung .wahl { align-items: flex-start; height: auto; padding: 4px 0; line-height: 1.45; color: var(--fg); }
  .panel .bestaetigung .wahl input { margin-top: 2px; }
  .panel-knoepfe { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .panel .feld input { width: 100%; }
  .panel .skalieren-zeile { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .panel .skalieren-zeile .feld { width: 130px; }
  .panel .leiste select { flex: 1 1 150px; }
  .panel pre { max-height: 320px; margin: 0; font-size: 12px; }
  .zaehler { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .zaehler > div { padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-m); background: var(--flaeche); }
  .zaehler b { display: block; font-size: 22px; line-height: 1.1; font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
  .zaehler span { font-size: 12px; color: var(--mut); }
  .zaehler .schlecht b { color: var(--schlecht); }
  .zaehler .akz b { color: var(--akz); }
  .panel .tabliste { max-height: 300px; overflow: auto; margin-top: 6px; }
  /* In FYOS wächst das Fenster mit, nur die Fläche scrollt (_stil.css Abschnitt 13); Logs (pre) bleiben ein Kasten */
  html[data-host="fyos"][data-rahmen="frei"] :is(.codes, .pods, .panel .tabliste) { max-height: none; }
  .panel .tabliste .zeile { min-height: 46px; padding: 8px 10px; }

  /* ── Schmal und Berührung ─────────────────────────────────────────────────── */
  @media (max-width: 480px) {
    #reiter { max-width: none; margin-bottom: 20px; }
    .knoten { padding: 16px 15px; }
    .detail { padding: 2px 12px 14px; }
    .mess-wert { font-size: 20px; }
    .panel { padding: 13px 13px; }
    .zaehler b { font-size: 20px; }
    .kennzahl .zahl-gross { font-size: 26px; }
  }
  @media (pointer: coarse) {
    #reiter button { min-height: 40px; }
    details > summary { min-height: 40px; }
    .hinweis details > summary { min-height: 36px; }
  }
</style>
</head>
<body data-breite="voll">
<!--KOPF-->
  <button id="neu" class="rund drehen" title="Aktualisieren" aria-label="Aktualisieren"><svg class="ico" data-symbol="refresh-cw"></svg></button>
<!--/KOPF-->
<div id="lage-satz" class="satz" role="status" aria-live="polite"><span class="laedt">Lage wird geprüft …</span></div>
<div id="reiter" class="reiter" role="tablist" aria-label="Bereiche" data-klebt>
  <button type="button" role="tab" id="r-ueberblick" class="an" aria-selected="true" aria-controls="t-ueberblick" data-tab="ueberblick">Überblick<span class="punkt" role="img" hidden></span></button>
  <button type="button" role="tab" id="r-workloads" aria-selected="false" aria-controls="t-workloads" data-tab="workloads" tabindex="-1">Workloads<span class="punkt" role="img" hidden></span></button>
  <button type="button" role="tab" id="r-flux" aria-selected="false" aria-controls="t-flux" data-tab="flux" tabindex="-1">Flux<span class="punkt" role="img" hidden></span></button>
  <button type="button" role="tab" id="r-mehr" aria-selected="false" aria-controls="t-mehr" data-tab="mehr" tabindex="-1">Ereignisse</button>
</div>

<main>
  <!-- Überblick: Knoten und was nicht stimmt -->
  <div id="t-ueberblick" role="tabpanel" aria-labelledby="r-ueberblick" data-panel="ueberblick">
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="server"></svg>Knoten<span id="knoten-zahl" class="anzahl"></span></h2>
      <div id="knoten-meldungen" class="meldungen"></div>
      <div id="knoten" class="raster"><div class="laedt gross">Knoten werden geladen …</div></div>
    </section>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="triangle-alert"></svg>Was nicht stimmt<span id="lage-zahl" class="anzahl"></span></h2>
      <div id="lage"><div class="laedt gross">Wird geprüft …</div></div>
    </section>
  </div>

  <!-- Workloads und CronJobs -->
  <div id="t-workloads" role="tabpanel" aria-labelledby="r-workloads" data-panel="workloads" hidden>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="boxes"></svg>Workloads<span id="wl-zahl" class="anzahl"></span><span id="wl-info" class="rechts mut"></span></h2>
      <div class="filter">
        <div id="wl-knoten" class="knoepfe" role="group" aria-label="Knoten"></div>
        <div class="leiste">
          <input id="wl-q" type="search" placeholder="Name oder Image suchen" aria-label="Workloads suchen" autocomplete="off">
          <select id="wl-ns" aria-label="Namespace"><option value="">Alle Namespaces</option></select>
          <label class="wahl"><input id="wl-probleme" type="checkbox"> Nur Probleme</label>
        </div>
      </div>
      <div id="wl-meldungen" class="meldungen"></div>
      <div id="workloads"><div class="gruppe"><div class="laedt gross">Workloads werden geladen …</div></div></div>
    </section>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="timer"></svg>CronJobs<span id="cj-zahl" class="anzahl"></span><span id="cj-info" class="rechts mut"></span></h2>
      <div class="filter">
        <div class="leiste">
          <input id="cj-q" type="search" placeholder="CronJob suchen" aria-label="CronJob suchen" autocomplete="off">
          <label class="wahl"><input id="cj-alle" type="checkbox"> Alle zeigen</label>
        </div>
      </div>
      <div id="cj-meldungen" class="meldungen"></div>
      <div id="cronjobs"><div class="gruppe"><div class="laedt gross">CronJobs werden geladen …</div></div></div>
    </section>
  </div>

  <!-- Flux -->
  <div id="t-flux" role="tabpanel" aria-labelledby="r-flux" data-panel="flux" hidden>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="git-branch"></svg>Flux<span id="flux-zahl" class="anzahl"></span><span id="flux-info" class="rechts mut"></span></h2>
      <div id="flux"><div class="laedt gross">Flux wird geprüft …</div></div>
    </section>
  </div>

  <!-- Mehr: Ereignisse und Altlasten -->
  <div id="t-mehr" role="tabpanel" aria-labelledby="r-mehr" data-panel="mehr" hidden>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="activity"></svg>Ereignisse<span id="ev-zahl" class="anzahl"></span></h2>
      <div class="filter">
        <div class="leiste">
          <select id="ev-std" aria-label="Zeitraum"><option value="6">Letzte 6 Stunden</option><option value="24" selected>Letzte 24 Stunden</option><option value="72">Letzte 3 Tage</option></select>
          <label class="wahl"><input id="ev-warn" type="checkbox" checked> Nur Warnungen</label>
          <button id="ev-laden" class="klein"><svg class="ico" data-symbol="refresh-cw"></svg>Neu laden</button>
        </div>
      </div>
      <div id="ereignisse"></div>
    </section>
    <section class="abschnitt">
      <h2><svg class="ico" data-symbol="archive"></svg>Altlasten</h2>
      <div id="altlasten"></div>
    </section>
  </div>
</main>

<script>
/*BRUECKE*/
const $ = (id) => document.getElementById(id);
const { esc, symbol, kachel, marke, zustand, zahl, zeit, knoepfe } = App;
const kopfsatz = App.satz;

// ── Hilfen ──────────────────────────────────────────────────────────────────
const mz = (x, eins, viele) => `${zahl(x, 0)} ${x === 1 ? eins : viele}`;
const kuerze = (t, n) => { const s = String(t ?? "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
/** „vor 192 min“ → „vor 3 Std.“ in Texten, die der Hub fertig liefert. */
const dauerIn = (t) => String(t ?? "").replace(/\b(vor|seit) (\d+) min\b/g, (_, w, m) => `${w} ${zeit.dauer(Number(m))}`);
/** Kurzformen aus Kubernetes: „10m“ → „10 Min.“, „1h30m“ → „1 Std. 30 Min.“ */
const dauerKurz = (t) => String(t ?? "").replace(/(?:\d+[hms])+(?![a-z])/g, (z) => [...z.matchAll(/(\d+)([hms])/g)].filter((p) => p[1] !== "0")
  .map((p) => `${p[1]} ${p[2] === "h" ? "Std." : p[2] === "m" ? "Min." : "Sek."}`).join(" "));
/** CPU-Verbrauch in Kernen; winzige Werte nicht auf „0“ runden. */
const kerneText = (c) => { const x = Number(c) || 0; return x < 0.01 ? "weniger als 0,01 Kerne" : `${zahl(x, x < 10 ? 2 : 1)} ${x === 1 ? "Kern" : "Kerne"}`; };
const stufe = (p, warn = 75, schlecht = 90) => p == null ? "" : p >= schlecht ? "schlecht" : p >= warn ? "warn" : "";
/** „seit 3 Std.“, ganz frisch „seit eben“ */
const seit = zeit.seit;
/** Alarmnamen aus Prometheus auf Deutsch; was hier fehlt, bleibt, wie es heißt. */
const ALARM = {
  KubeJobFailed: "Job gescheitert", KubeJobNotCompleted: "Job läuft zu lange", PodNotReady: "Pod nicht bereit", KubePodNotReady: "Pod nicht bereit",
  KubePodCrashLooping: "Pod stürzt immer wieder ab", KubeDeploymentReplicasMismatch: "Deployment ohne alle Replikas",
  KubeStatefulSetReplicasMismatch: "StatefulSet ohne alle Replikas", KubeDaemonSetRolloutStuck: "DaemonSet-Rollout hängt",
  KubeNodeNotReady: "Knoten nicht bereit", KubeNodeUnreachable: "Knoten nicht erreichbar", KubeletDown: "Kubelet nicht erreichbar",
  CPUThrottlingHigh: "CPU stark gedrosselt", KubeCPUOvercommit: "CPU überbucht", KubeMemoryOvercommit: "Arbeitsspeicher überbucht",
  NodeFilesystemSpaceFillingUp: "Festplatte füllt sich", NodeFilesystemAlmostOutOfSpace: "Festplatte fast voll",
  NodeMemoryHighUtilization: "Arbeitsspeicher stark ausgelastet", TargetDown: "Messziel nicht erreichbar",
  NetzSchnittstelleFlapptDauerhaft: "Netzschnittstelle flackert dauerhaft",
};
/** Pod-Problem aus der Lage: „playwright-mcp vor 192 min“ → „Container playwright-mcp · vor 3 Std.“ */
function podDetail(roh, detail) {
  const d = String(detail ?? ""); let m;
  if (roh === "OOMKilled" && (m = /^(.+?) vor (\d+) min$/.exec(d))) return `Container ${m[1]} · vor ${zeit.dauer(Number(m[2]))}`;
  if ((m = /^seit (\d+) min Pending$/.exec(d))) return `Wartet seit ${zeit.dauer(Number(m[1]))}`;
  if ((m = /^seit (\d+) min$/.exec(d))) return `Seit ${zeit.dauer(Number(m[1]))} nicht bereit`;
  if ((m = /^([^\s:]+): (.+)$/s.exec(d))) return `Container ${m[1]}: ${meldung(m[2])}`; // „relay: Back-off pulling image …“
  return meldung(dauerIn(d));
}
/** Kubernetes- und Flux-Gründe auf Deutsch; der Originalname bleibt im Tooltip. */
const GRUND = {
  OOMKilled: "Speicher aufgebraucht", OOMKilling: "Speicher aufgebraucht", SystemOOM: "Systemspeicher aufgebraucht",
  CrashLoopBackOff: "Stürzt immer wieder ab", BackOff: "Wartet nach Absturz",
  ImagePullBackOff: "Image nicht ladbar", ErrImagePull: "Image nicht ladbar", ErrImageNeverPull: "Image nicht ladbar", InvalidImageName: "Image-Name ungültig",

function geladen(was) { S.veraltet.delete(was); S.stand = Date.now(); kopfZeichnen(); }
function misslungen(was, e, wo, titel, aktion) {
  if (S[was]) { S.veraltet.add(was); kopfZeichnen(); return; }
  const titel_ = [].concat(titel);
  [].concat(wo).forEach((id, i) => {
    const t = titel_[i] ?? titel_[0];
    $(id).innerHTML = id === "cronjobs" || id === "workloads" ? imGruppe(fehlerZustand(t, e, aktion)) : fehlerZustand(t, e, aktion);
  });
}
async function ladenKnoten() {
  try { S.knoten = await rufen("knoten", { voll: true }); if (!S.knoten || !Array.isArray(S.knoten.knoten)) throw new Error("Die Antwort war leer."); knotenZeichnen(); geladen("knoten"); }
  catch (e) { misslungen("knoten", e, "knoten", "Knoten nicht lesbar", "neu-knoten"); }
}
async function ladenLage() {
  try { const d = await rufen("lage", {}); if (!d || !Array.isArray(d.gruppen)) throw new Error("Die Antwort war leer."); S.lage = d; lageSatzZeichnen(); lageZeichnen(); geladen("lage"); }
  catch (e) {
    if (S.lage) { S.veraltet.add("lage"); kopfZeichnen(); return; }
    lageFehler(e); $("lage").innerHTML = fehlerZustand("Lage nicht lesbar", e, "neu-lage");
  }
}
async function ladenWorkloads() {
  try { const d = await rufen("workloads", {}); if (!d || !Array.isArray(d.workloads)) throw new Error("Die Antwort war leer."); S.wl = d; wlZeichnen(); geladen("wl"); }
  catch (e) { misslungen("wl", e, ["workloads", "cronjobs"], ["Workloads nicht lesbar", "CronJobs nicht lesbar"], "neu-wl"); }
}
async function ladenFlux() {
  try { const d = await rufen("flux_zustand", {}); if (!d || !d.arten) throw new Error("Die Antwort war leer."); S.flux = d; fluxZeichnen(); geladen("flux"); }
  catch (e) { misslungen("flux", e, "flux", "Flux nicht lesbar", "neu-flux"); }
}
async function allesLaden(ohne) {
  $("neu").disabled = true;
  await Promise.all([ohne === "knoten" ? null : ladenKnoten(), ohne === "lage" ? null : ladenLage(),
    ohne === "workloads" ? null : ladenWorkloads(), ohne === "flux" ? null : ladenFlux(),
    S.ereigGeladen && ohne !== "ereignisse" ? ereignisseLaden() : null, S.alt && ohne !== "altlasten" ? altlastenLaden() : null]);
  $("neu").disabled = false;
}
$("neu").addEventListener("click", () => allesLaden());

// Ein Ergebnis vom Host (Werkzeug-Aufruf) — erkennen, zeichnen, den Rest selbst holen.
// Eine gefilterte Antwort (ein Knoten, ein Namespace …) zeigt nicht alles; dann wird vollständig nachgeladen.
function uebernehmen(d) {
  if (!d) return null;
  if (Array.isArray(d.knoten) && d.quellen) {
    if (d.knapp || d.knoten.length < 2) return null; // knappe Ansicht (KI-Aufruf) oder ein einzelner Knoten: allesLaden holt die Vollform
    S.knoten = d; knotenZeichnen(); geladen("knoten"); return "knoten";
  }
  if (d.zustand && Array.isArray(d.gruppen)) { S.lage = d; lageSatzZeichnen(); lageZeichnen(); geladen("lage"); return "lage"; }
  if (Array.isArray(d.workloads)) {
    const f = d.filter || {};
    if (f.ns || f.knoten || f.nur_probleme) { // gefilterte Antwort: die Filter übernehmen, die vollständige Liste holt allesLaden nach
      S.start = { ns: f.ns || "", knoten: f.knoten || "", probleme: !!f.nur_probleme };
      tabWechseln("workloads"); return null;
    }
    S.wl = d; wlZeichnen(); geladen("wl"); tabWechseln("workloads"); return "workloads";
  }
  if (d.arten) { S.flux = d; fluxZeichnen(); geladen("flux"); tabWechseln("flux"); return "flux"; }
  // Wer die App über die Ereignisse oder die Altlasten öffnet, sieht dort gleich das Ergebnis.
  if (Array.isArray(d.gruppen) && "stunden" in d) {
    S.ereig = d; S.ereigGeladen = true; $("ev-std").value = String(d.stunden); $("ev-warn").checked = !!d.nur_warnungen;
    ereignisseZeichnen(); tabWechseln("mehr"); return "ereignisse";
  }
  if (Array.isArray(d.released_pvs)) { S.alt = d; altlastenZeichnen(); S.ereigGeladen = true; tabWechseln("mehr"); return "altlasten"; } // die Ereignisse holt allesLaden gleich mit
  return null;
}
let bekommen = false;
App.auf("ui/notifications/tool-input", (p) => {
  const a = (p && p.arguments) || {};
  if (typeof a.knoten === "string" && a.knoten && !a.mit_kubelet) S.fokus = a.knoten; // „zeig mir knoten-a“: Überblick, dort springen
});
App.auf("ui/notifications/tool-result", (r) => {
  if (bekommen) return; bekommen = true;
  const art = uebernehmen(App.daten(r));
  allesLaden(art);
});
altlastenStart();
App.start("fyos-steuerpult").then(() => { setTimeout(() => { if (!bekommen) { bekommen = true; allesLaden(); } }, 1500); }).catch(() => {});
</script>
</body>
