# Leserechte des Einspeisers (CronJob graph-einspeisen): nur get/list auf das, woraus der Graph gebaut wird.
# KEINE Secrets (der Einspeiser liest nie welche), nichts Schreibendes.
#
# BEISPIEL: den Platzhalter <NAMESPACE> durch den Namensraum des CronJobs ersetzen.
#
# Was wofür gebraucht wird
#   nodes, pods, services, persistentvolumeclaims, persistentvolumes, deployments, statefulsets, daemonsets, cronjobs
#       Quelle k8s (Knoten, Dienste, Services, Volumes, Platzierung)
#   configmaps
#       Quelle k8s sucht darin nach Dienstadressen; die Quellen caddy und hub lesen Caddyfile und Hub-Konfiguration
#       daraus, wenn sie als ConfigMap eingerichtet sind. Wer das nicht will, nimmt die Zeile heraus: k8s lässt die
#       ConfigMaps dann aus, caddy und hub brauchen dann Dateien.
#   kustomizations, helmreleases, imagerepositories, imagepolicies
#       Quelle flux. Ohne Flux im Cluster ist die Quelle aus; die Zeilen können dann bleiben oder wegfallen.
# Rückweg: Datei samt CronJob entfernen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graph-einspeisen
  namespace: <NAMESPACE>
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: graph-einspeisen-lesen
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, persistentvolumeclaims, persistentvolumes, configmaps]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories, imagepolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: graph-einspeisen-lesen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: graph-einspeisen-lesen
subjects:
  - kind: ServiceAccount
    name: graph-einspeisen
    namespace: <NAMESPACE>
